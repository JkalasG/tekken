<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1020">
  <title>Ascensor Vilaseca</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A2%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand"><span class="brand-ico">🏢</span><b>AGENCIA VILASECA S.A.</b><em>ASCENSOR</em></div>
    <div id="slots" class="slots"></div>
    <div class="top-right">
      <span id="me-chip" class="chip"></span>
      <button id="btn-leave" class="mini" hidden>Salir</button>
      <button id="btn-sound" class="mini" title="Sonido">🔊</button>
      <button id="btn-admin" class="mini" title="Reiniciar sala (administrador)">⚙</button>
    </div>
  </header>

  <main id="main">
    <!-- MENÚ -->
    <section id="v-menu" class="view" hidden>
      <div class="menu-card">
        <div class="menu-ico">🏢</div>
        <h1>ASCENSOR<span>VILASECA</span></h1>
        <p class="sub">Sube al <b>piso 7</b> respondiendo preguntas. El primero en llegar a la <b>Agencia Vilaseca S.A.</b> gana.</p>
        <div class="menu-btns">
          <button class="btn big p0" data-take="0">JUGADOR 1<small id="m-s0"></small></button>
          <button class="btn big p1" data-take="1">JUGADOR 2<small id="m-s1"></small></button>
          <button class="btn ghost" id="m-spec">👀 SOLO MIRAR (espectador)</button>
        </div>
        <p id="menu-note" class="note"></p>
      </div>
    </section>

    <!-- SELECCIÓN DE PERSONAJES (estilo Tekken) -->
    <section id="v-select" class="view" hidden>
      <div class="tk2">
        <div class="tk-stage2">
          <div class="tk-vs2">VS</div>
          <div class="side s0"><div class="hero h0" id="f0"></div><div class="namebar n0" id="nb0"></div></div>
          <div class="side s1"><div class="hero h1" id="f1"></div><div class="namebar n1" id="nb1"></div></div>
        </div>
        <div class="tk-roster">
          <div class="tk-tab">ELIGE TU PERSONAJE</div>
          <div class="frame"><div id="grid" class="grid"></div></div>
        </div>
      </div>
      <div id="sel-controls" class="controls"></div>
      <p class="hint" id="sel-hint"></p>
    </section>

    <!-- VS -->
    <section id="v-vs" class="view" hidden>
      <div class="vs-wrap">
        <div class="vs-side vs0" id="vs0"></div>
        <div class="vs-mid"><span>VS</span></div>
        <div class="vs-side vs1" id="vs1"></div>
      </div>
      <div class="vs-sub">Primero en llegar al piso 7 · Agencia Vilaseca S.A.</div>
    </section>

    <!-- JUEGO -->
    <section id="v-game" class="view" hidden>
      <div class="game">
        <div class="panel p0" id="panel-0"></div>
        <div class="building" id="building">
          <div class="roof"><span>AGENCIA VILASECA S.A.</span><small>PISO 7</small></div>
          <div class="bbody" id="bbody">
            <div class="rows" id="rows"></div>
            <div class="shaft s0"><div class="cab" id="cab-0"></div></div>
            <div class="shaft s1"><div class="cab" id="cab-1"></div></div>
          </div>
          <div class="ground">ENTRADA · PISO 1</div>
        </div>
        <div class="panel p1" id="panel-1"></div>
      </div>
      <div id="countdown" class="overlay" hidden><div id="cd-num">3</div></div>
      <div id="endscreen" class="overlay end" hidden></div>
    </section>
  </main>

  <div id="reconnect" class="overlay solid" hidden><div>Reconectando…</div></div>
  <div id="toast" role="status"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
